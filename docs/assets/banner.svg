<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Kriterio: developer tools, compared side by side">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity=".08"/></pattern>
    <radialGradient id="halo-supabase"><stop offset="0" stop-color="#3FCF8E" stop-opacity=".55"/><stop offset="1" stop-color="#3FCF8E" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-postman"><stop offset="0" stop-color="#FF6C37" stop-opacity=".55"/><stop offset="1" stop-color="#FF6C37" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-vite"><stop offset="0" stop-color="#9135FF" stop-opacity=".55"/><stop offset="1" stop-color="#9135FF" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-nestjs"><stop offset="0" stop-color="#E0234E" stop-opacity=".55"/><stop offset="1" stop-color="#E0234E" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-firebase"><stop offset="0" stop-color="#DD2C00" stop-opacity=".55"/><stop offset="1" stop-color="#DD2C00" stop-opacity="0"/></radialGradient>
    <style>
      .tile { animation: float 6s ease-in-out infinite; }
      .halo { animation: breathe 4s ease-in-out infinite; }
      .badge { animation: pop 6s ease-in-out infinite; transform-origin: 760px 212px; }
      @keyframes float { 50% { transform: translateY(-10px); } }
      @keyframes breathe { 50% { opacity: .45; } }
      @keyframes pop { 0%, 80%, 100% { transform: scale(1); } 88% { transform: scale(1.12) rotate(-6deg); } }
      @media (prefers-reduced-motion: reduce) { .tile, .halo, .badge { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#16211E"/>
  <rect width="1280" height="360" rx="20" fill="url(#dots)"/>

  <g font-family="Newsreader, Georgia, 'Times New Roman', serif" font-weight="700">
    <rect x="72" y="88" width="78" height="78" rx="14" fill="#0B6E5E"/>
    <text x="111" y="148" font-size="62" fill="#FFFFFF" text-anchor="middle">K</text>
    <text x="156" y="148" font-size="62" fill="#FFFFFF">riterio</text>
  </g>
  <text x="74" y="214" font-family="'Public Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#E1E8E5">Developer tools, compared side by side.</text>
  <g font-family="'Public Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="74" y="248" width="198" height="38" rx="8" fill="#F2B33D"/>
    <text x="173" y="273" fill="#16211E" text-anchor="middle">Official sources only</text>
    <rect x="286" y="248" width="196" height="38" rx="8" fill="#FFFFFF" fill-opacity=".1"/>
    <text x="384" y="273" fill="#FFFFFF" text-anchor="middle">Written by a dev</text>
    <rect x="496" y="248" width="150" height="38" rx="8" fill="#FFFFFF" fill-opacity=".1"/>
    <text x="571" y="273" fill="#FFFFFF" text-anchor="middle">A clear pick</text>
  </g>

  <g class="badge" font-family="'Public Sans', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="732" y="194" width="56" height="36" rx="18" fill="#F2B33D"/>
    <text x="760" y="219" fill="#16211E" text-anchor="middle">vs</text>
  </g>
